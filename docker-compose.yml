version: '3.8'

services:
  db:
    image: postgres:14-alpine
    container_name: expenses_db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=expenses_manager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: expenses_server
    restart: always
    ports:
      - "3333:3333"
    environment:
      - PORT=3333
      - DB_HOST=db
      - DB_USER=admin
      - DB_PASS=admin
      - DB=expenses_manager
    command: sh -c "npx knex migrate:latest --knexfile ./knexfile.js && npm start"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: expenses_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - API_URL=http://server:3333
    depends_on:
      - server

volumes:
  pgdata:
